name: Build Readest 0.11.17 Android clone

on:
  push:
    branches:
      - android-v0.11.17-clone
    paths:
      - '.github/workflows/build-android-clone.yml'
      - '.github/scripts/badge-readest-icon.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android build tools
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;36.0.0'

      - name: Setup image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick fonts-dejavu-core

      - name: Download Apktool 3.0.3
        run: |
          curl -fL --retry 3 \
            -o apktool.jar \
            'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar'

          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' \
            | sha256sum -c -

          java -jar apktool.jar --version

      - name: Download official Readest 0.11.17 arm64 APK
        run: |
          curl -fL --retry 3 \
            -o Readest_0.11.17_arm64.apk \
            'https://github.com/readest/readest/releases/download/v0.11.17/Readest_0.11.17_arm64.apk'

          unzip -t Readest_0.11.17_arm64.apk >/dev/null

      - name: Decode APK
        run: |
          java -jar apktool.jar d \
            -f \
            Readest_0.11.17_arm64.apk \
            -o decoded

      - name: Patch package identity and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("decoded/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"

          old = "com.bilingify.readest"
          new = "com.bilingify.readest.v01117"
          clone_label = "Readest 0.11.17"

          component_tags = {
              "application",
              "activity",
              "activity-alias",
              "service",
              "receiver",
              "provider",
          }

          for elem in root.iter():
              tag = elem.tag.rsplit("}", 1)[-1]

              if tag in component_tags:
                  key = android + "name"
                  name = elem.attrib.get(key)
                  if name and name.startswith("."):
                      elem.set(key, old + name)

          root.set("package", new)

          application = root.find("application")
          if application is not None:
              application.set(android + "label", clone_label)

          for elem in root.iter():
              tag = elem.tag.rsplit("}", 1)[-1]
              name = elem.attrib.get(android + "name")
              if tag == "activity" and name == old + ".MainActivity":
                  elem.set(android + "label", clone_label)

              for key, value in list(elem.attrib.items()):
                  local = key.rsplit("}", 1)[-1]
                  if local in {
                      "authorities",
                      "permission",
                      "readPermission",
                      "writePermission",
                      "taskAffinity",
                  } and old in value:
                      elem.set(key, value.replace(old, new))

              key = android + "name"
              if tag in {
                  "permission",
                  "permission-tree",
                  "permission-group",
                  "uses-permission",
              }:
                  value = elem.attrib.get(key)
                  if value and value.startswith(old):
                      elem.set(key, value.replace(old, new, 1))

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android",
          )

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True,
          )

          text = manifest.read_text(encoding="utf-8")
          assert 'package="com.bilingify.readest.v01117"' in text
          assert 'android:name="com.bilingify.readest.MainActivity"' in text
          assert 'android:label="Readest 0.11.17"' in text

          print("Patched package:", old, "->", new)
          print("Clone label:", clone_label)
          PY

      - name: Add 11 badge to launcher icon
        run: |
          bash .github/scripts/badge-readest-icon.sh decoded

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b \
            decoded \
            -o clone-unsigned.apk

      - name: Generate signing key
        env:
          STOREPASS: readest-clone-local
        run: |
          keytool -genkeypair \
            -v \
            -keystore clone.jks \
            -storepass "$STOREPASS" \
            -keypass "$STOREPASS" \
            -alias clone \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Readest 0.11.17 Clone, OU=Local Build, O=Jush, L=Tainan, C=TW'

      - name: Align and sign APK
        env:
          STOREPASS: readest-clone-local
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/36.0.0

          "$BT/zipalign" \
            -f \
            -p \
            4 \
            clone-unsigned.apk \
            clone-aligned.apk

          "$BT/apksigner" sign \
            --ks clone.jks \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$STOREPASS" \
            --ks-key-alias clone \
            --out Readest_0.11.17_arm64_clone.apk \
            clone-aligned.apk

      - name: Verify signed APK
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/36.0.0

          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            Readest_0.11.17_arm64_clone.apk

          "$BT/aapt2" dump xmltree \
            Readest_0.11.17_arm64_clone.apk \
            --file AndroidManifest.xml \
            > manifest-dump.txt

          grep -q 'com.bilingify.readest.v01117' manifest-dump.txt
          grep -q 'com.bilingify.readest.MainActivity' manifest-dump.txt
          grep -q 'Readest 0.11.17' manifest-dump.txt

          sha256sum \
            Readest_0.11.17_arm64_clone.apk \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload clone APK
        uses: actions/upload-artifact@v4
        with:
          name: Readest-0.11.17-arm64-clone-badged
          path: |
            Readest_0.11.17_arm64_clone.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
